document:
  preamble: |
    \usepackage[T1]{fontenc}
    \usepackage{tgheros}
    \renewcommand{\sfdefault}{qhv} % TeX Gyre Heros family name
    \renewcommand{\familydefault}{\sfdefault}
  structure:
    - source: header.tex
      substitutions:
        - search: Universityname
          replace: University of Nowhere
        - search: Departmentname
          replace: ABC 1234
        - search: Instructorname
          replace: Eustace T. Smartypants
        - search: Instructoremail
          replace: ets@unow.edu
        - search: Coursename
          replace: BIO 5678 - Introduction to Applied Pyrohydrodynamics
        - search: Termcode
          replace: 202525
        - search: Termname
          replace: Winter 2025-2026
    - text: |
          \asnheader{Assignment 1: Random Topics}{January 13, 2026}
    - enumerate:
      - source: simple_arithmetic.tex
        points: 25  
      - source: simple_derivatives.tex
        points: 25
      - source: simple_integration.tex
        points: 25
      - source: python_numerics.tex
        points: 25
    - source: footer.tex
build:
  job-name: Assignment
  paths:
    build-dir: ./build
