    \usepackage[T1]{fontenc}
    \usepackage{tgheros}
    \renewcommand{\sfdefault}{qhv}
    \renewcommand{\familydefault}{\sfdefault}
    \renewcommand{\Universityname}{University of Nowhere}
    \renewcommand{\Departmentname}{ABC 126}
